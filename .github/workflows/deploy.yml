name: Deploy

# Publishes the site to Cloudflare (the `chek-website` Worker at chek.page)
# after every push to main. Run it from the Actions tab to redeploy without a
# push. It checks the site the way CI does first, so a push that fails CI
# never goes live.
on:
  push:
    branches: [main]
  workflow_dispatch:

# A deploy that has started always finishes, and only the newest waiting
# one runs after it, so an older build can't replace a newer one.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to chek.page
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://chek.page
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bun run lint
      - run: bun run format:check
      - run: bun run typecheck
      # `cf` signs in with the token in the environment instead of the
      # browser. The account comes from cloudflare.config.ts.
      - name: Build and deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add a CLOUDFLARE_API_TOKEN secret in Settings, Secrets and variables, Actions"
            exit 1
          fi
          bun run deploy
